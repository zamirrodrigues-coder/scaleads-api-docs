tada novamente."}}}},"leadCreatedWebgr":{"post":{"tags":["Perfil WebGR"],"summary":"Lead criado — perfil WebGR","description":"O ScaleAds envia exatamente um lead para `https://integracoes.webgrapp.com.br/api/leads/importar/webgr/{company_code}`. Campos sem valor válido são omitidos e nenhum dado é fabricado. A URL persistida não contém query; `username` e `password` são anexados somente em memória no instante do envio.","operationId":"receiveLeadCreatedWebgr","externalDocs":{"description":"Documentação pública do receptor WebGR","url":"https://documenter.getpostman.com/view/32499757/2sAYdZuZuA"},"security":[{"ScaleAdsHmac":[],"WebGRUsername":[],"WebGRPassword":[]}],"parameters":[{"$ref":"#/components/parameters/XScaleAdsEvent"},{"$ref":"#/components/parameters/XScaleAdsEventId"},{"$ref":"#/components/parameters/XScaleAdsTimestamp"},{"$ref":"#/components/parameters/XScaleAdsSignature"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/WebGRPayload"},"examples":{"webgrLead":{"summary":"Lead sintético com os dados disponíveis","value":{"leads":[{"company_name":"Empresa de Teste Ltda","company_nick":"Empresa de Teste","contact":"Contato de Teste","origin_code":"SCALEADS","observation":"origem=formulario_teste | lead_id=900001 | event_id=lead-created-900001"}]}}}}}},"responses":{"2XX":{"description":"Só confirma entrega quando o corpo também contém JSON válido, `status` interno 2xx e `errors` vazio.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/WebGRResponse"},"examples":{"success":{"summary":"Resposta publicada de sucesso","value":{"status":200,"response":{"message":"Transação efetuada com sucesso"},"errors":null}}}}}},"3XX":{"description":"Falha definitiva. O ScaleAds não segue redirecionamentos."},"408":{"description":"Falha transitória; a entrega pode ser tentada novamente."},"429":{"description":"Falha transitória. `Retry-After` é respeitado, limitado a 360 minutos."},"4XX":{"description":
